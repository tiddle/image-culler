name: Build & Release

# Builds the single-file Windows .exe on a Windows runner (PyInstaller can't
# cross-compile). Push a tag like v0.3.0 to publish a GitHub Release with the
# exe attached; or trigger manually to get the exe as a build artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build exe
        run: pyinstaller --clean --noconfirm image-culler.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageCuller-windows
          path: dist/ImageCuller.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ImageCuller.exe
